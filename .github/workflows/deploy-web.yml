name: Deploy NexaCL Web Worker

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed master commit to deploy
        required: true
        type: string
      target:
        description: Worker to deploy (deploy updated Auth/API and D1 migration before manage)
        required: true
        default: web
        type: choice
        options: [web, manage]

permissions:
  contents: read

concurrency:
  group: nexa-${{ inputs.target || 'web' }}-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify reviewed deployment commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm worker:check
      - run: pnpm manage:check
      - name: Deploy selected Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the cloudflare-pages environment.'
            exit 1
          fi
          case "$DEPLOY_TARGET" in
            web) pnpm exec wrangler deploy ;;
            manage) pnpm exec wrangler deploy --config wrangler.manage.jsonc ;;
            *) echo '::error::Unknown deployment target.'; exit 1 ;;
          esac
