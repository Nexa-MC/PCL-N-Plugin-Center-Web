<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NexaCL — 一个更省心的 Minecraft 启动器。">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=nexacl-20261003">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/nexacl-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/nexacl-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/nexacl-180.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>NexaCL — 一个更省心的 Minecraft 启动器</title>
    <style>html{background:#f2f4f8;color:#1f2733}html.dark{background:#10181f;color:#e2edf3}</style>
    <script>
      // Apply the saved theme before the first paint and the app bundle loads.
      (() => {
        let preference = 'system';
        try { const saved = localStorage.getItem('nexa:theme'); if (['light', 'dark', 'system'].includes(saved)) preference = saved; } catch { /* Storage may be disabled. */ }
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="boot-progress" style="position:fixed;top:0;left:0;height:2.5px;width:35%;background:#0891b2;z-index:4000;pointer-events:none;animation:boot-slide 1.1s ease-in-out infinite alternate"></div>
    <style>@keyframes boot-slide{from{transform:translateX(-30%)}to{transform:translateX(200%)}}@media(prefers-reduced-motion:reduce){#boot-progress{animation:none}}</style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
